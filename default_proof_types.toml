# Proof types this binary serves out of the box.
#
# A proof type names an immutable triple of proof system, guest program and version. It is not a
# proof system on its own: a proof is checked against one specific compiled program, so changing
# the guest or either version takes a NEW proof type rather than a change to an existing one.
#
# EIP-8025 fixes the supported set at {1, 2, 3} but assigns no meanings to the numbers, and expects
# further values to be socialised out of band. These assignments are therefore ours, and a `--proof-types`
# file overrides or extends them by proof type number.
#
# A verifying key is tied to the guest build, so `proof_system_version` records the version the
# guest was compiled and proved with. For SP1 it is not the verifier's own version: one pinned
# verifier reads several of these. ZisK's aggregation key changes with every release, so for ZisK it
# must be the version this binary pins.
#
# SP1 guests and keys come from eth-act/ere-guests v0.17.1, ZisK ones from v0.18.0.

[[proof_types]]
proof_type = 1
proof_system = "sp1"
proof_system_version = "6.4.0"
guest = "reth"
guest_version = "0.1.0-rc.3"
program_vk = "00a03cbfa95559cfee3b45ef925f3f7a631181e35e774e92b040277d893511dd"

